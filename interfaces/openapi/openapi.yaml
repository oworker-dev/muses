openapi: 3.1.0
info:
  title: OWorker SaaS Starter API
  version: 0.1.0
paths:
  /api/health:
    get:
      summary: Health check
      operationId: getHealth
      responses:
        "200":
          description: Application health status
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    type: string
                    enum:
                      - ok
                  service:
                    type: string
