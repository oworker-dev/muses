schema: "anss.service-map/0.1"
generatedFrom: "src/apps/api/src/capabilities.mjs"
service:
  id: "oworker.saas-starter"
  name: "OWorker SaaS Starter"
  canonicalServiceRoot: "/"
  programmableServiceBoundary:
    type: "hono"
    localBaseUrl: "http://localhost:3001"
discovery:
  agentServiceGuide: "/agent-guide.md"
  manifest: "/.well-known/anss.json"
  llms: "/llms.txt"
  serviceMap: "/anss/saas.service-map.yaml"
  installIndex: "/anss/install/index.json"
adapters:
  openapi:
    sourcePath: "interfaces/openapi/saas.openapi.yaml"
    publicPath: "/anss/openapi/saas.openapi.yaml"
  aclip:
    sourcePath: "interfaces/aclip/saas.md"
  mcp:
    sourcePath: "interfaces/mcp/saas.md"
  skills:
    sourcePath: "interfaces/skills/"
securityBoundary:
  scope: "metadata-only"
  adapterCallsUseSameServiceBoundary: true
  credentialModel: "service-defined"
  userAgentIsAuthorization: false
  anssDoesNotImplement:
    - "authentication"
    - "authorization"
    - "confirmation-ui"
    - "audit-log-storage"
    - "agent-runtime"
    - "third-party-registry"
  note: "ANSS declares safety metadata and adapter entrypoints. The product service remains responsible for authentication, authorization, confirmation, and audit behavior."
capabilities:
  - id: "saas.health.read"
    summary: "Read service health."
    safety:
      access: "public-read"
      writes: false
      requiresUserConfirmation: false
    human:
      path: "/admin/health"
      note: "Site-admin health UI requires site-admin access."
    http:
      method: "GET"
      path: "/health"
    inputSchema:
      type: "object"
      additionalProperties: false
      required:

      properties:

    outputSchema:
      type: "object"
      additionalProperties: false
      required:
        - "status"
        - "service"
        - "runtime"
      properties:
        status:
          type: "string"
          enum:
            - "ok"
            - "degraded"
        service:
          type: "string"
          description: "Runtime service id."
        runtime:
          type: "string"
          description: "Runtime implementation."
        startedAt:
          type: "string"
          description: "Service start timestamp."
        uptimeSeconds:
          type: "integer"
          description: "Service uptime in seconds."
    errorSchema:
      type: "object"
      additionalProperties: true
      required:
        - "status"
        - "detail"
      properties:
        status:
          type: "string"
          enum:
            - "error"
        detail:
          type: "string"
          description: "Human-readable error detail."
    aclip:
      command: "saas health read --json"
      aliases:
        - "health"
    mcp:
      tool: "saas.health.read"
