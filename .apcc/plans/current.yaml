    updatedAt: 2026-07-24T18:30:21.000Z
  - id: platform-core-alpha
    name: Platform Core Alpha：工作流原生创作空间
    summary: 以用户成果 Gate 拉动工作流原生创作空间：当前先验证专业模式真实首图，只补实际暴露的画布、DSL、Asset/Job/Capability、持久化与 Runtime 缺口。
    parentPlanId: null
    versionRef: null
    owner: codex-main
    pinned: true
    pinnedReason: 当前唯一工程关键路径。
    createdAt: 2026-07-24T19:56:41.199Z
    updatedAt: 2026-07-27T19:17:06.773Z
  - id: first-image-value-gate
    name: 价值 Gate 1：用户友好的真实生图闭环
    summary: 先让目标用户在专业模式中理解 Start→image.generate→End，并通过真实模型获得、检查和继续使用一张图片；只补齐这条路径实际暴露的最小缺口，通过后再进入 PPT 场景扩展。
    parentPlanId: platform-core-alpha
    versionRef: null
    owner: codex-main
    pinned: true
    pinnedReason: 当前唯一工程关键路径；阻止无用户结果证据的组件堆叠。
    createdAt: 2026-07-27T19:12:15.517Z
    updatedAt: 2026-07-27T19:12:15.517Z
  - id: core-gate-0
    name: Gate 0：最小技术基线与核心契约
    summary: 通过场景无关 Spike 选择画布 Alpha 技术基线，并定义工作流图、专业文档引用、Command、Revision、Asset、Job 与 Capability 最小契约。
    parentPlanId: platform-core-alpha
    versionRef: null
    owner: codex-main
    pinned: true
    pinnedReason: 进入实现前只解决会改变核心边界的高风险问题。
    createdAt: 2026-07-24T19:56:41.359Z
    updatedAt: 2026-07-24T19:56:41.359Z
  - id: workflow-canvas-alpha
    name: Slice 1：工作流无限画布 Alpha
    summary: 技术缺口池：仅当首图或真实场景暴露工作流画布交互、保存或历史阻断时拉取对应任务，不按组件顺序独立推进。
    parentPlanId: platform-core-alpha
    versionRef: null
    owner: codex-main
    pinned: false
    pinnedReason: null
    createdAt: 2026-07-24T19:56:41.526Z
    updatedAt: 2026-07-27T19:12:54.257Z
  - id: design-document-alpha
    name: Slice 2：DesignDocument 专业画布节点
    summary: 技术缺口池：仅当首图后续操作或 PPT 真实任务需要深度编辑时拉取 DesignDocument 能力，不预先追求完整设计编辑器。
    parentPlanId: platform-core-alpha
    versionRef: null
    owner: codex-main
    pinned: false
    pinnedReason: null
    createdAt: 2026-07-24T19:56:41.678Z
    updatedAt: 2026-07-27T19:12:54.482Z
  - id: image-capability-alpha
    name: Slice 3：资产、Job 与图像能力闭环
    summary: 能力缺口池：真实首图 Gate 拉取最小 Asset/Job/Capability 能力；图像处理等扩展只由已观察到的用户任务触发。
    parentPlanId: platform-core-alpha
    versionRef: null
    owner: codex-main
    pinned: false
    pinnedReason: null
    createdAt: 2026-07-24T19:56:41.832Z
    updatedAt: 2026-07-27T19:12:54.434Z
  - id: core-alpha-gate
    name: Platform Core Alpha Gate：独立与组合验收
    summary: 验证核心模块可独立运行、只经公共契约连接、保存恢复可靠，并为 Agent 提供稳定 Query/Command/Capability 接口。
    parentPlanId: platform-core-alpha
    versionRef: null
    owner: codex-main
    pinned: false
    pinnedReason: null
    createdAt: 2026-07-24T19:56:41.984Z
