    name: Agent Core Alpha：单 Agent 驱动创作空间
    summary: 当首图或后续真实场景证明直接 Capability 与人工工作流不足时，接入单 Agent Runtime，并仅通过公共 Query、Command 与 Capability 端口驱动创作空间。
