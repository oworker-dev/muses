items:
  - id: establish-platform-architecture
    name: 建立平台终局与架构基线
    summary: 定义长期产品目标、稳定模块边界、核心协议、演进规则和首轮内核验证路线。
    parentPlanId: null
    versionRef: null
    owner: codex-main
    pinned: true
    pinnedReason: 正式开发前必须保持可见的架构基线。
