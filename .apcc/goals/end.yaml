goalId: end-goal-ai
name: 建成开放可演进的 AI 创作操作系统
summary: 让个人、团队与 Agent 在统一、沉浸式的创作空间中，把模糊意图可靠地转化为可编辑、可追溯、可复用、可组合、可协作并可发布的图像、视频、音频与音乐、品牌、演示和社媒资产；平台以完全开源、Build in Public 和开放能力契约连接模型、工具与工作流，使用户拥有成果、数据与选择，使新媒体、新模型和新场景无需重写核心运行时即可接入。
docPath: shared/目标.md
successCriteria:
  - 图像、视频、音频、音乐、文字、演示和未来媒体共享稳定的资产、来源、版本与引用语义，同时保留专业编辑模型
  - 人工、Agent、工作流和开放 API 通过同一命令、能力、权限与审计边界修改创作状态
  - 核心能力可由交互界面、Agent 和工作流复用，并产生结构化、可编辑且语义一致的结果
  - 长任务支持观察、取消、重试、恢复和幂等提交，失败不破坏已确认成果或造成重复收费
  - 模型、工具和新媒体通过版本化契约接入，更换供应商无需重写项目与创作文档核心模型
  - 租户隔离、权限、审批、来源、版权、安全策略、成本与审计覆盖完整创作生命周期
  - 平台形成从 Brief、探索、编辑、评审到批量适配、导出和发布的连续商业创作闭环
  - 第三方能够构建可发现、可授权、可观测和可版本化的能力与工作流
  - 核心产品、协议、格式与迁移路径完全开源且可自托管，用户能够结构化导出项目、资产、版本、工作流与来源记录
  - AI 短剧、PPT 定制及外部目标用户在真实交付中持续获得可测量的速度、质量、控制、自由度与成本改善
nonGoals:
  - 不以接入全部 AI 模型或自研全部基础模型为目标
  - 不让单一行业场景、供应商、框架或 UI 形态定义核心领域模型
  - 不强迫二维画布、视频时间轴、演示分页和工作流图使用同一种编辑语义
  - 不在缺乏独立运行与跨入口复用证据时提前建设庞大平台抽象或拆分微服务
  - 不允许高影响 Agent 操作绕过权限、预算、确认、命令和来源记录
  - 不为短期生成演示牺牲可编辑性、数据隔离、可靠执行或兼容迁移
  - 不以代码保密、专有格式、数据扣留或故意削弱自托管版本建立主要商业壁垒
  - 不因纳入 AI 音乐而承诺自研音乐基础模型或建设完整数字音频工作站
  - 不因 Build in Public 公开用户私有内容、凭证、个人数据、安全利用细节或受限第三方材料
