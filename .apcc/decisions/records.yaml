items:
  - id: ai
    name: 确立开放 AI 创作操作系统为长期终局
    description: 将项目长期目标从通用 SaaS 模板升级为统一承载人、团队与 Agent 跨媒体创作的开放 AI 创作操作系统。
    docPath: shared/目标.md
    category: goal
    proposedBy: product-owner
    context: 项目即将进入正式开发，需要一个不随首个业务场景或模型供应商变化的终局坐标。
    impactOfNoAction: 各功能可能按局部场景独立生长，最终形成无法共享资产、上下文、执行记录与编辑能力的工具集合。
    expectedOutcome: 所有阶段规划都能以可编辑、可追溯、可复用、可组合、可发布的跨媒体创作闭环为共同目标。
    boundary: 定义产品长期成功状态与原则；不承诺一次性实现所有媒体、渠道、模型或企业能力。
    status: approved
    decisionSummary: 该终局准确覆盖统一创作空间、Agent 驱动、跨媒体资产和长期开放演进，同时避免把首个场景误当成产品边界。
    revisitCondition: 只有当产品主体不再是人机协同跨媒体创作平台，或核心用户价值发生根本变化时重审。
    createdAt: 2026-07-24T18:28:44.028Z
    decidedAt: 2026-07-24T18:28:56.359Z
  - id: decision
    name: 采用内核优先、契约优先、组合验证的架构
    description: 先构建可独立运行的创作文档、画布、Agent、工作流、任务与媒体能力内核，通过稳定协议连接，并用跨入口组合链路验证复用。
    docPath: internal/长期架构.md
    category: architecture
    proposedBy: product-owner
    context: 用户明确要求先确认通用可复用模块，避免从具体业务场景切入导致深度耦合。
    impactOfNoAction: 画布、Agent、工作流与媒体能力会重复实现状态、任务、权限和来源追踪，场景扩展成本持续上升。
    expectedOutcome: 每项能力可被人机界面、Agent、工作流和开放接口一致调用，业务场景仅负责编排而不侵入内核。
    boundary: 规定逻辑边界、协议和验证门；不提前拆分微服务，不冻结具体框架、模型厂商或 UI 形态。
    status: approved
    decisionSummary: 平台级产品需要稳定内核与协议，但抽象必须由独立运行和跨入口组合验证约束，避免空泛平台化。
    revisitCondition: 若至少两个独立内核经过真实组合验证后仍无法共享核心协议，或性能与一致性证据证明边界必须调整时重审。
    createdAt: 2026-07-24T18:28:44.188Z
    decidedAt: 2026-07-24T18:28:56.527Z
  - id: ai-2
    name: 将 AI 音频与音乐纳入跨媒体创作闭环
    description: 把音乐、配音、音效与音频处理定义为一等媒体能力，与图像、视频和演示共享资产、任务、来源、权限与成本协议。
    docPath: internal/长期架构.md
    category: scope
    proposedBy: product-owner
    context: AI 短剧、短视频、广告和演示的完整交付离不开配音、音效与音乐，现有范围只显式覆盖图像和视频。
    impactOfNoAction: 平台仍需依赖外部音频工具搬运素材，无法形成从创意到成片的闭环，也无法统一版权、时间轴和来源记录。
    expectedOutcome: 音频成为可独立运行且可组合的专业媒体模块，并能与镜头、角色、场景、品牌主题及发布流程关联。
    boundary: 纳入音频与音乐领域边界和长期路线；当前阶段不承诺自研音乐基础模型、完整 DAW 或立即实现全部音频能力。
    status: approved
    decisionSummary: 音频、音乐、配音和音效是短剧、视频、广告与演示的必要组成，应作为一等媒体能力共享平台协议并保留专业时间语义。
    revisitCondition: 只有真实用户证据长期表明音频不属于主要交付闭环，或独立产品边界明显更合理时重审。
    createdAt: 2026-07-24T19:00:05.763Z
    decidedAt: 2026-07-24T19:00:24.315Z
  - id: build-in-public
    name: 采用完全开源与 Build in Public 治理模式
    description: 核心产品、内核、协议、路线、决策与贡献过程默认公开，保障自托管、可迁移和可验证的用户自由，同时严格保护用户数据与安全秘密。
    docPath: shared/开放原则.md
    category: policy
    proposedBy: product-owner
    context: AI 时代编程实现不再是主要壁垒，项目希望以用户价值、开放自由、社区信任和真实创新建立长期竞争力。
    impactOfNoAction: 项目可能复制封闭平台的数据锁定和不透明决策，失去创始动机、社区协作优势与用户信任。
    expectedOutcome: 形成源码开放、建设透明、数据私密、标准开放、商业可持续的公开开发模式。
    boundary: 公开产品建设与可公开运营事实；不公开用户私有内容、凭证、个人数据、安全利用细节及受第三方许可限制的材料。
    status: approved
    decisionSummary: 项目以用户自由、公开验证和社区共同创造建立长期信任；开放建设必须与用户数据私密、安全责任和可持续商业并存。
    revisitCondition: 若许可证或公开粒度妨碍用户自由、安全、第三方合规或项目可持续性，应通过新政策决策调整具体实施而非放弃开放原则。
    createdAt: 2026-07-24T19:00:05.916Z
    decidedAt: 2026-07-24T19:00:24.470Z
  - id: decision-2
    name: 以创始人真实业务作为首批价值验证场
    description: 优先以 AI 短剧和 PPT 定制业务中的真实付费交付验证产品价值，同时持续引入外部用户证据纠偏。
    docPath: shared/价值宪法.md
    category: scope
    proposedBy: product-owner
    context: 项目源于创始人在 AI 短剧和 PPT 定制生产中遭遇工具割裂、价格高、自由不足和成果不可持续编辑的真实问题。
    impactOfNoAction: 平台可能从抽象技术兴趣出发，陷入无止境完美主义，开发大量不改善真实交付的基础设施。
    expectedOutcome: 每个内核和体验改进都能关联真实任务、时间、质量、成本与自由度指标，并由实际交付证明价值。
    boundary: 创始人业务是首证据而非永久唯一市场；场景仅作为价值和组合验收夹具，不向内核注入场景特例。
    status: approved
    decisionSummary: 创始人的 AI 短剧与 PPT 付费业务提供高频、跨媒体、可测量的真实需求，是防止技术自嗨的最佳首证据，同时必须接受外部用户纠偏。
    revisitCondition: 当外部证据显示首批市场或关键任务不同，或创始人业务不再代表目标用户时调整验证组合。
    createdAt: 2026-07-24T19:00:06.063Z
    decidedAt: 2026-07-24T19:00:24.626Z
  - id: wave-0
    name: 在 Wave 0 前建立产品价值与体验基线
    description: 先明确目标用户、关键任务、差异化体验、价值指标、商业假设和证据机制，再冻结关键技术路线与核心契约。
    docPath: shared/价值宪法.md
    category: change
    proposedBy: product-owner
    context: 长期正确要求技术与架构持续服务用户体验和实用价值，现有计划直接进入协议实验室，缺少防止跑偏和完美主义的产品判断基线。
    impactOfNoAction: 团队可能把架构优雅、模块数量或技术先进性误当成成果，无法判断何时停止、删减或转向。
    expectedOutcome: 建立可验证的价值宪法、体验承诺、北极星指标、护栏指标、假设台账与停止规则，成为技术决策的上游约束。
    boundary: 建立价值判断与验证系统；不在此阶段完成全部市场研究、品牌定位、定价或正式功能开发。
    status: approved
    decisionSummary: 价值与体验基线必须成为技术路线和核心契约的上游约束，以可验证成果和停止规则抑制跑偏与无止境完美主义。
    revisitCondition: 当价值基线已稳定且新证据仅影响局部功能时无需重开此阶段；若目标用户或核心价值主张根本变化则重审。
    createdAt: 2026-07-24T19:00:06.212Z
    decidedAt: 2026-07-24T19:00:24.780Z
  - id: muses
    name: 采用 Muses 作为项目公开代号
    description: 将 AI Design Platform 的项目代号与公开仓库身份统一为 Muses，同时保留长期产品定义和架构目标。
    docPath: shared/概览.md
    category: policy
    proposedBy: product-owner
    context: 项目准备创建首个公开 GitHub 仓库，需要稳定、简洁、可传播的项目身份。
    impactOfNoAction: 公开仓库继续沿用通用 saas 模板名称，难以形成清晰项目认知，并可能让开发者误解产品边界。
    expectedOutcome: 公开文档、APCC 项目名、仓库名和首个版本统一使用 Muses。
    boundary: 确定项目代号和公开身份；不在本次决策中重命名所有内部 SaaS 契约、端口、数据库或运行资源。
    status: approved
    decisionSummary: Muses 简洁地表达灵感、创作与多媒体协作，适合作为公开项目代号；技术内部标识可按后续兼容计划逐步迁移。
    revisitCondition: 若出现明确商标、域名、社区混淆或目标用户认知风险时重审。
    createdAt: 2026-07-24T19:13:21.299Z
    decidedAt: 2026-07-24T19:13:33.754Z
  - id: mvp
    name: 采用双轨贯穿切片交付首个 MVP
    description: 以通用内核最小闭环和 PPT 商业材料真实场景同步推进，替代所有内核完成后才验证场景的串行交付方式。
    docPath: internal/MVP交付路线.md
    category: scope
    proposedBy: codex-main
    context: 现有 Wave 0 至 Wave 5 串行路线直到最后阶段才触达真实场景，不符合尽快获得通用能力可用与场景价值证据的目标。PPT 定制是现有真实业务，包含结构、页面、文本、图像、品牌与可编辑导出，能以较低媒体复杂度覆盖首批核心协议。
    impactOfNoAction: 项目可能长期停留在协议与平台抽象建设，模块虽各自完整但组合风险、体验风险和真实交付价值被延迟发现。
    expectedOutcome: 每个迭代都同时产生可独立运行的通用模块证据和一段真实 PPT 交付证据；首个 MVP 在不牺牲模块边界的前提下尽快完成 Brief 到可编辑交付闭环，随后用 AI 短剧验证跨时间媒体扩展。
    boundary: 首个 MVP 只覆盖单用户 PPT/商业材料、页面画布、资产、一个图像能力、受控 Agent、固定模板工作流和可编辑导出；不阻塞于多人实时协作、通用 DAG 编辑器、视频时间线、AI 音乐、插件市场、移动端或完整品牌系统。
    status: approved
    decisionSummary: 批准以 PPT 商业材料作为首个真实纵向切片，并让价值证据轨与技术去险、通用内核交付并行推进。通用模块保持独立契约和 Harness，场景只通过公开端口组合；首个真实 PPT 基线在契约冻结前必须就绪，AI 短剧用于 MVP 后的第二场景与跨时间媒体验证。
    revisitCondition: 若 PPT 真实交付无法覆盖首批文档、画布、资产、任务、能力、Agent 或可编辑导出价值，或技术 Spike 证明可编辑 PPTX 交付路线不可行，则重新选择首个纵向场景或缩减 MVP。
    createdAt: 2026-07-24T19:27:14.406Z
    decidedAt: 2026-07-24T19:29:09.351Z
  - id: decision-3
    name: 采用工作流原生无限画布与专业文档节点架构
    description: 将工作流原生无限画布定义为 Muses 顶层创作空间，纯设计画布及未来 PPT、视频、音频等专业编辑器作为可进入、可版本化、可分支和可执行的专业文档节点；先跑通无 Agent 的平台核心 Alpha，再逐层接入 Agent。
    docPath: internal/平台核心Alpha路线.md
    category: architecture
    proposedBy: product-owner
    context: Muses 对标 Codex、Lovart 与 Codia 的综合体验，需要同时呈现创作内容、执行过程、来源关系和专业编辑空间。此前计划以 PPT 页面画布和 PPTX 导出作为当前硬门，过早让具体场景与历史 image-to-editable-SVG 探索影响通用平台内核。
    impactOfNoAction: 项目可能先形成孤立的传统设计编辑器或纯节点 DAG，再为 Agent、媒体编辑与工作流补建第二套状态、命令和交互系统；也可能让 PPT/SVG 路线错误冻结平台契约。
    expectedOutcome: 顶层画布统一承载内容节点、任务节点、Agent/Capability 节点、来源/上下文边与可执行工作流边；DesignDocument 等专业节点在聚焦后提供自己的深度编辑语义。平台先用图像输入、生成/处理、结果分支、人工选择、DesignDocument 编辑和保存恢复证明通用闭环，再接单 Agent、平台级 MusesAgent、领域 Agent 与多 Agent 调度。
    boundary: 当前只定义顶层画布、节点/边语义、专业文档节点边界、命令/修订和交付顺序；不冻结具体画布库、Agent SDK、PPT 页面模型、PPTX、image-to-editable-SVG、视频时间线、音频工程或通用工作流发布引擎。
    status: approved
    decisionSummary: 批准以工作流原生无限画布作为 Muses 顶层创作空间，以 DesignDocument 等专业编辑器作为可进入的版本化节点。平台核心 Alpha 先在无 Agent 条件下验证工作流图、专业文档、资产、Job、图像能力、分支选择和保存恢复；随后接入单 Agent，再建设 MusesAgent、领域 Agent 与多 Agent 调度。PPT 保留为首个场景 MVP，但不再作为平台核心技术栈、首批契约或画布实现的前置门。
    revisitCondition: 若真实使用证明顶层工作流空间显著增加普通创作负担，或嵌套专业文档节点无法在性能、可访问性和编辑体验上成立，则重审默认视图与画布分层，但仍保持工作流语义和专业媒体语义分离。
    createdAt: 2026-07-24T19:55:12.296Z
    decidedAt: 2026-07-24T19:55:59.959Z
  - id: vercel-agent-harness
    name: 采用分层 Vercel 工作流生态与可替换 Agent Harness 路线
    description: 以 AI Elements + XYFlow 作为外层画布首选投影候选，以 Workflow SDK 作为耐久执行候选，以 Eve 和 Pi 作为未来 Agent Harness 主候选与对照候选；AI SDK 只承担模型与流式交互适配，Muses 保有文档、命令、资产、来源与策略权威状态。
    docPath: internal/平台技术栈与AgentHarness路线.md
    category: architecture
    proposedBy: product-owner
    context: Muses 需要同时达到 Lovart/Codia 式沉浸画布和 Codex 级自主 Agent。AI Elements 的 Canvas 已基于 XYFlow，Workflow SDK 解决耐久步骤但不拥有可视化探索图；传统 AI/Chat SDK 也不足以提供上下文压缩、恢复、沙箱、审批与多 Agent 调度。
    impactOfNoAction: 项目可能重复实现成熟开源能力，或把 UI 图、耐久执行状态、Agent 会话与 Muses 权威文档混为一体，导致供应商锁定、迁移困难和长期能力上限。
    expectedOutcome: 复用 Vercel 开放生态加速外层画布、耐久执行和 Agent 构建，同时通过 Muses 自有协议保持技术可替换性；画布和 Agent 候选都由统一 Spike 与硬门决定。
    boundary: 本决策只确认分层、候选优先级和依赖方向；不把 AI Elements/XYFlow、Workflow SDK、Eve、Pi、Konva、Fabric 或 Pixi 冻结为最终实现，不提前进入 Agent 开发，也不让第三方 SDK 类型进入权威 Schema。
    status: approved
    decisionSummary: 批准以 Muses 自有领域内核为中心，分层使用 AI Elements/XYFlow、Workflow SDK、Eve/Pi 和 AI SDK。外层画布、耐久执行与 Agent Harness 通过独立 adapter 连接，任何第三方运行状态都不得成为 WorkflowDocument、DesignDocument、Command、Revision、Asset、Job 或 Provenance 的权威来源。
    revisitCondition: 若统一 Spike 证明 AI Elements/XYFlow 无法满足目标规模或专业交互，Workflow SDK 无法满足自托管与可观测要求，或 Eve/Pi 无法在 Muses 策略、沙箱和操作端口边界下运行，则替换对应 adapter，不改变领域内核。
    createdAt: 2026-07-24T20:56:54.135Z
    decidedAt: 2026-07-24T20:57:04.868Z
  - id: decision-4
    name: 采用双模式同源画布并优先交付专业模式
    description: Muses 使用同一 WorkflowDocument 提供创作模式与专业模式两种无分叉投影；专业模式作为完整无损视图先行，画布瞬时交互状态与领域权威状态分离。
    docPath: null
    category: architecture
    proposedBy: codex-main
    context: 当前画布 Spike 已证明领域命令闭环，但节点逻辑过度暴露内部结构、变量与结果节点抽象难懂，并因缺少实时节点变化适配产生明显拖动卡顿。
    impactOfNoAction: 继续堆节点会冻结错误用户心智、恶化交互性能，并导致未来常规模式与专业模式形成两套不兼容文档。
    expectedOutcome: 专业模式达到 Coze 级节点逻辑、变量选择与运行调试体验；创作模式未来可在同一文档上隐藏复杂度；拖动过程保持实时，结束时仅提交一次领域命令。
    boundary: 当前只重构工作流画布投影、交互状态和首批专业节点；不接入 Workflow SDK 耐久运行时、不开发 Agent、不冻结 image-result 或 selector 的当前 UI 形态。
    status: approved
    decisionSummary: 用户检查后确认当前画布抽象且难用，并要求推进双模式与 Coze 式专业模式落地。领域文档保持同源，专业模式先验证完整语义，创作模式后续作为简化投影；实时交互状态不进入领域文档。
    revisitCondition: 只有用户研究或性能证据证明同源投影无法覆盖两类体验时，才重新评估文档分层，不允许先复制两套权威状态。
    createdAt: 2026-07-26T14:29:36.842Z
    decidedAt: 2026-07-26T14:29:46.869Z
  - id: decision-5
    name: 采用用户成果拉动、缺口补齐的交付顺序
    description: 每个阶段先定义并运行用户可见成果，再依据真实阻塞补齐 DSL、界面、能力和基础设施；首个价值 Gate 是在专业模式中以用户友好方式完成真实生图，随后用真实 PPT 任务扩展能力边界。
    docPath: internal/用户成果驱动交付计划.md
    category: change
    proposedBy: product-owner
    context: 当前工程已经证明多项画布与耐久运行语义，但产品负责人仍无法自然生成一张真实图片，说明技术任务顺序没有持续对齐用户获得感。
    impactOfNoAction: 项目会继续按组件清单堆叠发布、恢复、画布和文档能力，在缺少用户结果证据时冻结过度或错误的抽象。
    expectedOutcome: 每轮都有可观察的用户结果、明确缺口和最小修复；首图闭环通过后，PPT 真实任务只拉动其实际需要的新节点和内核能力。
    boundary: 保留工作流原生画布、专业模式先行、同源 DSL 和既有 Runtime 证据；不立即切换创作模式，不删除已验证内核，也不预先冻结图像供应商、PPT 页面模型、Agent 或导出路线。
    status: approved
    decisionSummary: 以用户可见成果作为每个阶段的入口和退出门，先让专业模式完成用户友好的真实首图，再由 PPT 等真实场景暴露并拉动缺口；技术内核继续保持稳定边界，但不再按组件清单串行完成。
    revisitCondition: 若连续真实任务证明成果 Gate 无法暴露关键平台风险，或只做最小缺口导致不可接受的数据、安全、可靠性或迁移债务，再调整 Gate 粒度，但不回到无用户证据的组件堆叠。
    createdAt: 2026-07-27T19:12:00.906Z
    decidedAt: 2026-07-27T19:12:08.394Z
  - id: site-admin-muses
    name: 扩展 Site Admin 为隔离的 Muses 平台控制面
    description: 复用 OWorker Site Admin 的认证、布局和审计基础，新增模型目录、能力规格、价格、路由与用量管理，同时保持站点运营与产品控制面分组隔离。
    docPath: internal/模型能力目录与平台控制面.md
    category: architecture
    proposedBy: product-owner
    context: 生图节点已暴露模型规格和价格硬编码；LLM、图像、视频、音乐等能力需要统一、版本化、可审计的管理入口。
    impactOfNoAction: 模型规格继续散落在节点 UI 和供应商适配器中，无法安全新增模型、调整价格、灰度或追踪成本。
    expectedOutcome: Studio 只引用稳定 modelRef 并从发布的能力目录渲染配置；平台管理员在受控后台管理模型供应、能力和价格。
    boundary: 只建设服务于 Muses 创作能力的模型控制面；不建设通用 CRM、任意插件市场或 Coze 式通用 AI 应用后台。
    status: approved
    decisionSummary: 产品负责人确认 Muses 需要 AI 工作流平台的创作基础能力与统一模型控制面；复用现有 Admin 能降低重复建设，但必须将站点运营与产品配置分组，并保持版本、审计和供应商适配边界。
    revisitCondition: 当模型控制面需要独立扩缩容、安全域或团队所有权时，再评估拆分独立服务。
    createdAt: 2026-07-27T21:22:32.642Z
    decidedAt: 2026-07-27T21:22:40.415Z
  - id: gate-1-1
    name: 在 Gate 1.1 建立认证工作区与积分结算硬边界
    description: Studio 与其 API 必须登录；每个资源归属受权工作区；付费模型运行通过不可变积分账本执行额度检查、预留、结算和释放。
    docPath: internal/用户工作区与积分计费边界.md
    category: architecture
    proposedBy: product-owner
    context: 当前 Studio 匿名可用且工作区标识硬编码，模型调用已经产生真实费用；继续扩展模型和资产会放大所有权、滥用与计费技术债。
    impactOfNoAction: 无法可靠判断谁拥有工作流和资产，无法防止匿名消耗生产凭证，也无法把模型价格、实际用量与用户余额闭环。
    expectedOutcome: 登录用户进入自己的工作区，所有 Studio API 服务端鉴权；付费运行在提交前检查并预留积分，结束后按版本化价格和实际用量结算且可审计。
    boundary: 本 Gate 建立身份、个人工作区、积分账户与运行结算内核；具体积分商品、促销、退款和企业套餐由后续商业验证决定。
    status: approved
    decisionSummary: 产品负责人明确要求现在偿还 Studio 匿名访问与计费不可连接的技术债；真实模型凭证已接入，因此认证、资源所有权和积分预留/结算是首图成果的组成部分。
    revisitCondition: 当团队工作区、企业合同或按法币直接计费成为已验证需求时，扩展角色、发票和价格策略，不改变不可变账本与运行结算原则。
    createdAt: 2026-07-27T21:22:50.754Z
    decidedAt: 2026-07-27T21:22:58.633Z
